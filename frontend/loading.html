<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Getting everything ready… — Finora Expense Tracker</title>
  <meta name="description" content="Please wait while we prepare your financial overview securely. Finora — Track. Plan. Save. Grow.">

  <!-- Typography: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       Finora Loading Page Design System
       ========================================================================== */
    :root {
      --color-deep-navy: #11183F;
      --color-sidebar: #171D4C;
      --color-primary-violet: #7957FF;
      --color-electric-blue: #48B9F5;
      --color-soft-lavender: #C7B8FF;
      --color-workspace: #F6F7FC;
      --color-card-bg: #FFFFFF;
      --color-main-text: #18213D;
      --color-secondary-text: #75809A;
      --color-border: #E8EBF3;
      --color-income: #23B981;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--color-workspace);
      color: var(--color-main-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    /* Subtle ambient decorative gradient in background */
    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(121, 87, 255, 0.06) 0%, rgba(72, 185, 245, 0.03) 50%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Centered Loading Card */
    .loading-card {
      background-color: var(--color-card-bg);
      border: 1px solid var(--color-border);
      border-radius: 24px;
      padding: 56px 44px;
      box-shadow: 0 16px 48px rgba(17, 24, 63, 0.08), 0 2px 6px rgba(17, 24, 63, 0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 480px;
      width: 100%;
      position: relative;
      z-index: 10;
      animation: floatIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Finora Brand Logo */
    .brand-logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      text-decoration: none;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, var(--color-primary-violet) 0%, #5B35E8 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(121, 87, 255, 0.35);
    }

    .brand-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.625rem;
      font-weight: 800;
      color: var(--color-deep-navy);
      letter-spacing: -0.02em;
    }

    /* Dual-Ring Violet and Blue Spinner */
    .loading-spinner-stage {
      position: relative;
      width: 64px;
      height: 64px;
      margin-bottom: 28px;
    }

    .spinner-ring-outer {
      width: 100%;
      height: 100%;
      border: 3.5px solid rgba(121, 87, 255, 0.15);
      border-top-color: var(--color-primary-violet);
      border-radius: 50%;
      animation: spinClockwise 1.1s infinite cubic-bezier(0.55, 0.15, 0.45, 0.85);
    }

    .spinner-ring-inner {
      position: absolute;
      top: 9px;
      left: 9px;
      right: 9px;
      bottom: 9px;
      border: 3px solid transparent;
      border-top-color: var(--color-electric-blue);
      border-radius: 50%;
      animation: spinCounterClockwise 0.75s infinite linear;
    }

    @keyframes spinClockwise {
      to { transform: rotate(360deg); }
    }

    @keyframes spinCounterClockwise {
      to { transform: rotate(-360deg); }
    }

    /* Headings */
    .loading-heading {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.375rem;
      font-weight: 700;
      color: var(--color-main-text);
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }

    .loading-supporting {
      font-size: 0.9375rem;
      color: var(--color-secondary-text);
      line-height: 1.6;
      max-width: 360px;
      margin-bottom: 28px;
    }

    /* Indeterminate Progress Bar */
    .progress-track {
      width: 240px;
      height: 4px;
      background-color: #E8EBF3;
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 32px;
    }

    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      background: linear-gradient(90deg, var(--color-primary-violet), var(--color-electric-blue));
      border-radius: 9999px;
      animation: indeterminatePulse 1.6s infinite ease-in-out;
    }

    @keyframes indeterminatePulse {
      0% {
        left: -35%;
        width: 35%;
      }
      50% {
        left: 35%;
        width: 45%;
      }
      100% {
        left: 100%;
        width: 30%;
      }
    }

    /* Brand Tagline */
    .brand-tagline {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-soft-lavender);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Bottom Quick Action */
    .direct-link-btn {
      margin-top: 24px;
      color: var(--color-primary-violet);
      text-decoration: none;
      font-size: 0.8125rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      opacity: 0.85;
    }

    .direct-link-btn:hover {
      opacity: 1;
      text-decoration: underline;
    }

    /* Reduced Motion Accessibility */
    @media (prefers-reduced-motion: reduce) {
      .spinner-ring-outer, .spinner-ring-inner, .progress-fill, .loading-card {
        animation: none !important;
      }
      .progress-fill {
        left: 0;
        width: 60%;
      }
    }
  </style>
</head>
<body>

  <!-- ======================================================================
       Screen 16: Centered Main Loading Screen
       ====================================================================== -->
  <main class="loading-card" role="status" aria-live="polite">
    
    <!-- Top-Center Finora Brand Logo -->
    <a href="index.html" class="brand-logo-group" title="Finora Home">
      <div class="brand-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="11" width="4" height="9" rx="1.5" fill="white" />
          <rect x="10" y="7" width="4" height="13" rx="1.5" fill="white" fill-opacity="0.9" />
          <rect x="17" y="4" width="4" height="16" rx="1.5" fill="white" />
          <path d="M5 8L12 4L19 2" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="19" cy="2" r="2" fill="#23B981"/>
        </svg>
      </div>
      <span class="brand-name">Finora</span>
    </a>

    <!-- Small Animated Violet-and-Blue Loading Indicator -->
    <div class="loading-spinner-stage" aria-hidden="true">
      <div class="spinner-ring-outer"></div>
      <div class="spinner-ring-inner"></div>
    </div>

    <!-- Main Heading -->
    <h1 class="loading-heading">Getting everything ready…</h1>

    <!-- Supporting Text -->
    <p class="loading-supporting">
      Please wait while we prepare your financial overview.
    </p>

    <!-- Subtle Progress Animation Line -->
    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill"></div>
    </div>

    <!-- Brand Tagline at Bottom -->
    <span class="brand-tagline">Track. Plan. Save. Grow.</span>

    <!-- Optional Quick Navigation to Loaded Dashboard -->
    <a href="dashboard.html" class="direct-link-btn">
      Skip wait and open Dashboard &rarr;
    </a>
  </main>

  <script>
    // Optional auto-redirect to dashboard after 3.5 seconds to simulate real-world app load
    setTimeout(() => {
      // If user remains on the page, redirect to dashboard.html
      const autoRedirect = new URLSearchParams(window.location.search).get('auto');
      if (autoRedirect === 'true') {
        window.location.href = 'dashboard.html';
      }
    }, 3500);
  </script>
</body>
</html>
